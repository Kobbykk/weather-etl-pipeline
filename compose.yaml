services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: data_engineering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_engineering"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: data_engineering
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: